[project]
name = "mint-integration-github"
version = "0.1.0-alpha.1"
description = "Mint plan-only repo.github integration. Snapshots in; no GitHub I/O."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.12.*"
authors = [{ name = "opsdevcode" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
mint-integration-github = "implementation.reference_server:main"

[project.urls]
Homepage = "https://github.com/opsdevcode/mint-integration-github"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["implementation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
